name: reel
# One verified story -> HyperFrames reel (style A explainer, style B if urgent) -> queue as kind "reel".
# Replaces the old Pillow reel path (kahwa_publisher/reel.py, retired 2026-10-29).
# Concept B stings (2026-10-29, kahwa_publisher/stings/policy.py): the 08:11/14:11 UTC slots make an edition reel «العالم في 30 ثانية»
# (edition sting 3.56 s + 3 verified headlines, real story locations as dots, body music = bars 1-4 of bed-breaking, <= 60 s,
# ends on a fade); a style-B single-story reel gets the «عاجل» alert sting only when the story is top-tier (>= 2 outlets incl.
# a tier-1 outlet), max 1/day and 3/week, never right after an edition reel. Counts in state/stings.json (scheduled runs only).
# Fix 2026-10-29 (run 40929624756): an editorial fail-closed verdict (claims unsupported after the retries) is now a skip
# (exit 0, no alert email) and spelled-out source numbers count; the quota commit no longer dies on the npm-rewritten
# package.json (npm install --no-save, git pull --rebase --autostash, and the push loop now fails loudly).
# Safety: while the repo variable PUBLISHING_ENABLED != "true" (or dry_run is ticked) the run renders + QA's only and
# uploads the MP4 as a workflow artifact; nothing is queued, nothing is published. A broken reel is never queued.
on:
  schedule:
    - cron: "41 11,17 * * *"   # 12:41 and 18:41 Algeria (the existing reel slots, after the 11:13/17:13 newsroom runs)
    - cron: "11 8,14 * * *"    # 09:11 and 15:11 Algeria: edition reels «العالم في 30 ثانية» (multi-headline, edition sting)
  workflow_dispatch:
    inputs:
      slot:
        description: "External trigger only: ISO slot time (e.g. 2026-11-01T06:30Z). A slot that already has a queue item is skipped (idempotent)"
        type: string
        default: ""
      dry_run:
        description: "Render + QA only (no queue, no media push)"
        type: boolean
        default: false
      host_test:
        description: "Dry run only: also host the MP4 on GitHub Pages as test-<file> (checks video/mp4) and probe Zernio media storage (no post is created)"
        type: boolean
        default: false
      test_story:
        description: "Render test only: path of a saved story fixture (e.g. tests/fixtures/reel-map-tunisia.json). No news fetch, no LLM, never queued"
        type: string
        default: ""
      mode:
        description: "single = one-story reel; edition = «العالم في 30 ثانية» multi-headline reel with the edition sting"
        type: choice
        options: [auto, single, edition]
        default: auto
      style:
        description: "Render tests with test_story only: force style A or B (empty = from the story)"
        type: string
        default: ""
      sting_test:
        description: "Dry runs only: force the «عاجل» alert sting on a style-B reel (render test, never queued)"
        type: boolean
        default: false
      edition_fixture:
        description: "Edition render test only: saved rundown spec (e.g. tests/fixtures/bulletin-2026-10-29.json). Never queued"
        type: string
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: reel            # one run per workflow at a time; duplicate clocks queue, then skip at the gate
  cancel-in-progress: false
jobs:
  gate:
    # slot dedupe for 3 clocks (cron-job.org, Cloudflare Worker backup, GitHub schedule): kahwa_publisher/slots.py
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      key: ${{ steps.g.outputs.key }}
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main, persist-credentials: false }   # latest main at job start: sees markers pushed by an earlier clock
      - id: g
        env:
          SLOT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.test_story != '' || inputs.edition_fixture != '') }}
          MODE_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
        run: |
          python3 -m kahwa_publisher.slots gate reel --slot "$SLOT_IN" --test "$TEST" --mode "$MODE_IN" | tee gate.json
          echo "### slot gate: $(cat gate.json)" >> "$GITHUB_STEP_SUMMARY"
  reel:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: "1"
      PYTHONUNBUFFERED: "1"
      HYPERFRAMES_TELEMETRY: "0"
      KAHWA_BUILD: /tmp/kahwa-reel
      HF_WORKERS: "3"
      MODE: ${{ needs.gate.outputs.mode || 'single' }}   # auto = from the slot (08:11/14:11 UTC = edition), explicit input wins
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main }   # latest state/ + queue/ (a queued duplicate run must not act on a stale checkout)
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-ci.txt }
      - uses: actions/setup-node@v7.1.0
        with: { node-version: "22" }
      - name: System packages (ffmpeg)
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; fi
          ffmpeg -version | head -1
      - name: Preflight (disk budget, pinned deps)
        run: |
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9); echo "free disk: ${free}G"
          if [ "$free" -lt 12 ]; then sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /; fi
          for i in 1 2 3; do pip install -q -r requirements-ci.txt && break; echo "pip retry $i"; sleep $((i*20)); done
      - name: Cache HyperFrames (pinned 0.8.214) + Chrome Headless Shell
        uses: actions/cache@v6.1.0
        with:
          path: |
            kahwa_publisher/reels/node_modules
            ~/.cache/hyperframes
            ~/.cache/puppeteer
          key: hf-0.8.214-${{ runner.os }}-${{ hashFiles('kahwa_publisher/reels/package.json', 'kahwa_publisher/reels/npm-shrinkwrap.json') }}
      - name: Install HyperFrames + browser
        run: |
          # --no-save: npm must not rewrite package.json (a modified tracked file broke "git pull --rebase" in run 40929624756)
          # npm ci from the committed lockfile (npm-shrinkwrap.json), no install scripts except the pinned esbuild binary check
          for i in 1 2 3; do test -x kahwa_publisher/reels/node_modules/.bin/hyperframes || { npm ci --prefix kahwa_publisher/reels --ignore-scripts --no-audit --no-fund && npm rebuild esbuild --prefix kahwa_publisher/reels; }; test -x kahwa_publisher/reels/node_modules/.bin/hyperframes && break; sleep $((i*20)); done
          cd kahwa_publisher/reels
          npx hyperframes --version
          npx hyperframes telemetry disable || true
          for i in 1 2 3; do npx hyperframes browser ensure && break; sleep $((i*20)); done
          echo "KAHWA_CHROME=$(npx hyperframes browser path | tail -1)" >> "$GITHUB_ENV"
      - name: Make reel
        id: make
        timeout-minutes: 30
        env:
          KAHWA_SLOT: ${{ needs.gate.outputs.slot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          LLM_QUOTA_FILE: state/llm_quota-reel.json
          PUBLISHING_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'false' || vars.PUBLISHING_ENABLED }}
          # one-line switch (repo variable): "library" = assets/music ACE-Step tracks, "synth" = code-synthesised bed
          MUSIC_SOURCE: ${{ vars.MUSIC_SOURCE || 'library' }}
          TEST_STORY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_story || '' }}
          STYLE: ${{ github.event_name == 'workflow_dispatch' && inputs.style || '' }}
          STING_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.sting_test) && '1' || '' }}
          EDITION_FIXTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.edition_fixture || '' }}
        run: |
          start=$(date +%s)
          mkdir -p out
          ST=""; [ -n "$STYLE" ] && ST="--style $STYLE"
          if [ "$MODE" = "edition" ]; then
            if [ -n "$EDITION_FIXTURE" ]; then python -m kahwa_publisher.bulletin.make --mode edition --out out --dry --fixture "$EDITION_FIXTURE"
            else python -m kahwa_publisher.bulletin.make --mode edition --out out; fi
          elif [ -n "$TEST_STORY" ]; then python -m kahwa_publisher.reels.make --out out --dry --story "$TEST_STORY" $ST
          else python -m kahwa_publisher.reels.make --out out; fi
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          echo '### Kahwa reel' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;d=json.load(open('out/summary.json'));d.get('qa',{}).pop('mean_luma',None);print(json.dumps(d,ensure_ascii=False,indent=1)[:6000])" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.json
            out/*.jpg
            out/keyframes/
            out/error.txt
            out/*-card.jpg
            out/degraded.txt
          retention-days: 5
          if-no-files-found: ignore
      - name: Host the MP4 on GitHub Pages (only when a queue item was produced)
        if: success() && hashFiles('out/queue-item.json') != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          F=$(ls out/*-reel.mp4 | head -1)
          URL=$(bash tools/host_reel.sh "$F")
          WANT=$(python -c "import json;print(json.load(open('out/queue-item.json'))['media'][0]['url'])")
          [ "$URL" = "$WANT" ] || { echo "hosted URL $URL != queue URL $WANT"; exit 1; }
      - name: Hosting test (dry run only, nothing is queued or posted)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.host_test && hashFiles('out/*-reel.mp4') != ''
        env:
          GH_TOKEN: "${{ github.token }}"
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          set -e
          F=$(ls out/*-reel.mp4 | head -1)
          cp "$F" "out/test-$(basename "$F")"
          URL=$(bash tools/host_reel.sh "out/test-$(basename "$F")")
          curl -sI "$URL" | grep -iE '^(HTTP|content-type|content-length)' | tee -a "$GITHUB_STEP_SUMMARY"
          python - "$URL" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, urllib.request
          from kahwa_publisher.providers import Zernio
          z = Zernio()
          if not z.key:
              print("zernio probe: no ZERNIO_API_KEY, skipped"); sys.exit(0)
          pub = z.stage_video(sys.argv[1])
          if not pub:
              sys.exit("zernio probe: staging failed")
          r = urllib.request.urlopen(urllib.request.Request(pub, method="HEAD"), timeout=60)
          print(f"zernio probe: staged on Zernio storage, HTTP {r.status}, {r.headers.get('Content-Type')}, {r.headers.get('Content-Length')} bytes (temp storage, auto-deleted after 7 days; no post created)")
          PY
      - name: Queue the reel for the dispatcher
        if: success() && hashFiles('out/queue-item.json') != ''
        run: |
          ID=$(python -c "import json;print(json.load(open('out/queue-item.json'))['id'])")
          mkdir -p queue && cp out/queue-item.json "queue/${ID}.json"
          git config user.name "kahwa-bot"
          git config user.email "kahwa-bot@users.noreply.github.com"
          git add queue
          for f in state/reels_seen.json state/llm_quota-reel.json state/stings.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "reel queued ${ID}"
          ok=0; for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && { ok=1; break; }; echo "push race (another bot commit landed first): rebase + retry $i/4"; sleep $((i*7)); done; [ $ok = 1 ]
      - name: Card fallback (video failed after verification; queued only while publishing is enabled)
        if: success() && hashFiles('out/fallback-item.json') != ''
        run: |
          ID=$(python -c "import json;print(json.load(open('out/fallback-item.json'))['id'])")
          mkdir -p queue media && cp out/fallback-item.json "queue/${ID}.json" && cp out/*-card.jpg media/
          git config user.name "kahwa-bot"
          git config user.email "kahwa-bot@users.noreply.github.com"
          git add queue media
          for f in state/reels_seen.json state/llm_quota-reel.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "reel card fallback ${ID}"
          ok=0; for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && { ok=1; break; }; echo "push race (another bot commit landed first): rebase + retry $i/4"; sleep $((i*7)); done; [ $ok = 1 ]
      - name: Degraded notice (one issue thread, not one per run)
        if: always() && hashFiles('out/degraded.txt') != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T="Kahwa reel: video degraded to card post"
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; cat out/degraded.txt; } > deg.txt
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file deg.txt || true; else gh issue create --title "$T" --body-file deg.txt || true; fi
      - name: Commit LLM quota usage (scheduled runs; nothing else)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && hashFiles('state/llm_quota-reel.json') != ''
        run: |
          git config user.name "kahwa-bot"
          git config user.email "kahwa-bot@users.noreply.github.com"
          git add state/llm_quota-reel.json
          # stories dropped by a gate are marked as reeled (make.py) so the next slot writes another one
          [ -f state/reels_seen.json ] && git add state/reels_seen.json
          git diff --cached --quiet || git commit -m "reel llm quota $(date -u +%FT%TZ)"
          ok=0; for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && { ok=1; break; }; echo "push race (another bot commit landed first): rebase + retry $i/4"; sleep $((i*7)); done; [ $ok = 1 ]
      - name: Alert (GitHub issue = email) and skip
        # manual dry-run tests fail loudly in the run itself but do not open an issue/email
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.run_attempt >= 2 || !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo;
            cat out/error.txt 2>/dev/null || echo "Reel job failed before the renderer wrote an error (see run log). Nothing was queued."; } > alert.txt
          gh issue create --title "Kahwa reel alert $(date -u +%F' '%H:%M)" --body-file alert.txt || true
      - name: Mark slot done (first successful run of the slot; the other clocks then skip at the gate)
        if: success() && needs.gate.outputs.key != ''
        run: |
          # earlier steps already pushed their own commits (or the job failed): re-apply the marker on the newest main each
          # try, so a concurrent bot commit can never leave a rebase conflict (run 41190343334)
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          ok=0; for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -m kahwa_publisher.slots done reel "${{ needs.gate.outputs.key }}"
            git add state/slots
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "slot done ${{ needs.gate.outputs.key }}" && git push -q origin HEAD:main && { ok=1; break; }
            sleep $((i*5)); done; [ $ok = 1 ]
      - name: Count a failed attempt (deterministic-failure guard; the gate gives up on a slot after 2 failed runs)
        # 2026-10-31 (runs 41197869535 / 41198098858 / 41199797479): failed runs leave no slot marker, so every clock
        # (cron-job.org, Worker, GitHub schedule) re-ran the same deterministic failure. kahwa_publisher/slots.py MAX_ATTEMPTS.
        if: failure() && needs.gate.outputs.key != ''
        run: |
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          ok=0; for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -m kahwa_publisher.slots fail reel "${{ needs.gate.outputs.key }}"
            git add state/slots
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "slot attempt failed ${{ needs.gate.outputs.key }}" && git push -q origin HEAD:main && { ok=1; break; }
            sleep $((i*5)); done; [ $ok = 1 ] || echo "::warning::could not record the failed attempt"
