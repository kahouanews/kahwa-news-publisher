name: reel
# One verified story -> HyperFrames reel (style A explainer, style B if urgent) -> queue as kind "reel".
# Replaces the old Pillow reel path (kahwa_publisher/reel.py, retired 2026-10-29).
# Safety: while the repo variable PUBLISHING_ENABLED != "true" (or dry_run is ticked) the run renders + QA's only and
# uploads the MP4 as a workflow artifact; nothing is queued, nothing is published. A broken reel is never queued.
on:
  schedule:
    - cron: "41 11,17 * * *"   # 12:41 and 18:41 Algeria (the existing reel slots, after the 11:13/17:13 newsroom runs)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + QA only (no queue, no media push)"
        type: boolean
        default: true
      host_test:
        description: "Dry run only: also host the MP4 on GitHub Pages as test-<file> (checks video/mp4) and probe Zernio media storage (no post is created)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: reels
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: "1"
      HYPERFRAMES_TELEMETRY: "0"
      KAHWA_BUILD: /tmp/kahwa-reel
      HF_WORKERS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/reel.yml }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: System packages (ffmpeg)
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; fi
          ffmpeg -version | head -1
      - name: Python deps
        run: pip install -q numpy opencv-python-headless "pillow>=10.1" pyloudnorm feedparser
      - name: Cache HyperFrames (pinned 0.8.214) + Chrome Headless Shell
        uses: actions/cache@v4
        with:
          path: |
            kahwa_publisher/reels/node_modules
            ~/.cache/hyperframes
            ~/.cache/puppeteer
          key: hf-0.8.214-${{ runner.os }}-${{ hashFiles('kahwa_publisher/reels/package.json') }}
      - name: Install HyperFrames + browser
        run: |
          test -x kahwa_publisher/reels/node_modules/.bin/hyperframes || npm install --prefix kahwa_publisher/reels --no-audit --no-fund --save-exact
          cd kahwa_publisher/reels
          npx hyperframes --version
          npx hyperframes telemetry disable || true
          npx hyperframes browser ensure
          npx hyperframes browser path
      - name: Make reel
        id: make
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBLISHING_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'false' || vars.PUBLISHING_ENABLED }}
          # one-line switch (repo variable): "library" = assets/music ACE-Step tracks, "synth" = code-synthesised bed
          MUSIC_SOURCE: ${{ vars.MUSIC_SOURCE || 'library' }}
        run: |
          start=$(date +%s)
          python -m kahwa_publisher.reels.make --out out
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          echo '### Kahwa reel' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;d=json.load(open('out/summary.json'));d.get('qa',{}).pop('mean_luma',None);print(json.dumps(d,ensure_ascii=False,indent=1)[:6000])" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.json
            out/error.txt
          retention-days: 5
          if-no-files-found: ignore
      - name: Host the MP4 on GitHub Pages (only when a queue item was produced)
        if: success() && hashFiles('out/queue-item.json') != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          F=$(ls out/*-reel.mp4 | head -1)
          URL=$(bash tools/host_reel.sh "$F")
          WANT=$(python -c "import json;print(json.load(open('out/queue-item.json'))['media'][0]['url'])")
          [ "$URL" = "$WANT" ] || { echo "hosted URL $URL != queue URL $WANT"; exit 1; }
      - name: Hosting test (dry run only, nothing is queued or posted)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.host_test && hashFiles('out/*-reel.mp4') != ''
        env:
          GH_TOKEN: "${{ github.token }}"
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          set -e
          F=$(ls out/*-reel.mp4 | head -1)
          cp "$F" "out/test-$(basename "$F")"
          URL=$(bash tools/host_reel.sh "out/test-$(basename "$F")")
          curl -sI "$URL" | grep -iE '^(HTTP|content-type|content-length)' | tee -a "$GITHUB_STEP_SUMMARY"
          python - "$URL" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, urllib.request
          from kahwa_publisher.providers import Zernio
          z = Zernio()
          if not z.key:
              print("zernio probe: no ZERNIO_API_KEY, skipped"); sys.exit(0)
          pub = z.stage_video(sys.argv[1])
          if not pub:
              sys.exit("zernio probe: staging failed")
          r = urllib.request.urlopen(urllib.request.Request(pub, method="HEAD"), timeout=60)
          print(f"zernio probe: staged on Zernio storage, HTTP {r.status}, {r.headers.get('Content-Type')}, {r.headers.get('Content-Length')} bytes (temp storage, auto-deleted after 7 days; no post created)")
          PY
      - name: Queue the reel for the dispatcher
        if: success() && hashFiles('out/queue-item.json') != ''
        run: |
          ID=$(python -c "import json;print(json.load(open('out/queue-item.json'))['id'])")
          mkdir -p queue && cp out/queue-item.json "queue/${ID}.json"
          git config user.name "kahwa-bot"
          git config user.email "kahwa-bot@users.noreply.github.com"
          git add queue state/reels_seen.json
          git diff --cached --quiet || git commit -m "reel queued ${ID}"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
      - name: Alert (GitHub issue = email) and skip
        # manual dry-run tests fail loudly in the run itself but do not open an issue/email
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo;
            cat out/error.txt 2>/dev/null || echo "Reel job failed before the renderer wrote an error (see run log). Nothing was queued."; } > alert.txt
          gh issue create --title "Kahwa reel alert $(date -u +%F' '%H:%M)" --body-file alert.txt || true
