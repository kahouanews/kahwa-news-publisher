name: newsroom
on:
  schedule:
    - cron: "13 5-22/2 * * *"   # every 2h, 06:13-23:13 Algeria time
  workflow_dispatch:
    inputs:
      slot:
        description: "Backup clock only (Cloudflare Worker): ISO slot time, e.g. 2026-11-01T06:30Z. Empty = snap the run start to the last scheduled slot"
        type: string
        default: ""
      dry_run:
        description: "Test run: write posts + cards as a workflow artifact only (nothing queued, state/ and media/ untouched)"
        type: boolean
        default: false
      llm_probe:
        description: "Also list Gemini model ids, probe the cheap models with one tiny call each, and print LLM availability"
        type: boolean
        default: false
      writer_models:
        description: "Optional writer chain override for this run (comma list provider:model, e.g. gemini:gemma-4-31b-it)"
        type: string
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: newsroom            # one run per workflow at a time; duplicate clocks queue, then skip at the gate
  cancel-in-progress: false
jobs:
  gate:
    # slot dedupe for 3 clocks (cron-job.org, Cloudflare Worker backup, GitHub schedule): kahwa_publisher/slots.py
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      key: ${{ steps.g.outputs.key }}
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main, persist-credentials: false }   # latest main at job start: sees markers pushed by an earlier clock
      - id: g
        env:
          SLOT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MODE_IN: auto
        run: |
          python3 -m kahwa_publisher.slots gate newsroom --slot "$SLOT_IN" --test "$TEST" --mode "$MODE_IN" | tee gate.json
          echo "### slot gate: $(cat gate.json)" >> "$GITHUB_STEP_SUMMARY"
  write:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # write + fact-check + claim verification per story; Groq free tier is paced (8K TPM, 1K output TPM)
    env:
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      LLM_CHAIN_WRITER: ${{ github.event_name == 'workflow_dispatch' && inputs.writer_models || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main }   # latest state/ + queue/ (a queued duplicate run must not act on a stale checkout)
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q feedparser==6.0.14 pillow==13.0.0   # pinned (requirements-ci.txt)
      - name: LLM models, probes and availability (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.llm_probe
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          LLM_QUOTA_FILE: out/llm_quota-probe.json
        run: |
          mkdir -p out
          python -m kahwa_publisher.llm --list-models --status \
            --probe "gemini:gemma-4-31b-it,gemini:gemma-4-26b-a4b-it,gemini:gemini-3.1-flash-lite,gemini:gemini-3.5-flash-lite,groq:qwen/qwen3.8-27b,groq:openai/gpt-oss-120b,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free"
      - name: Fetch, rank (early-warning signals), verify across outlets, write original posts, verify claims, render cards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export PYTHONUNBUFFERED=1
          # each workflow writes its own quota file (no git conflicts); dry runs keep theirs out of state/
          if [ "$DRY" = "true" ]; then mkdir -p out; export LLM_QUOTA_FILE=out/llm_quota-newsroom-dry.json
          else export LLM_QUOTA_FILE=state/llm_quota-newsroom.json; fi
          if [ "$DRY" = "true" ]; then python -m kahwa_publisher.newsroom --dry --out out 2>&1 | tee out.log
          else python -m kahwa_publisher.newsroom; fi
      - name: Dry-run summary
        if: always() && env.DRY == 'true'
        run: |
          echo '### Kahwa newsroom (dry run: nothing queued)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '"signals"|"verify"|qa_reason|rejected_by_qa|written_dry|signal_error|llm_error|"llm|held|safety_' out.log | cut -c1-1500 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && env.DRY == 'true'
        with:
          name: newsroom-dry-${{ github.run_id }}
          path: |
            out/
            out.log
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit queue + cards
        if: env.DRY != 'true'
        run: |
          git config user.name "kahwa-bot"
          git config user.email "kahwa-bot@users.noreply.github.com"
          git add -A queue state media
          git diff --cached --quiet || git commit -m "newsroom $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Clean old cards (keep 7 days)
        if: env.DRY != 'true'
        run: |
          find media \( -name '*.jpg' -o -name '*.mp4' \) -mtime +7 -delete 2>/dev/null || true
      - name: Mark slot done (first successful run of the slot; the other clocks then skip at the gate)
        if: success() && needs.gate.outputs.key != ''
        run: |
          # earlier steps already pushed their own commits (or the job failed): re-apply the marker on the newest main each
          # try, so a concurrent bot commit can never leave a rebase conflict (run 41190343334)
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          ok=0; for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -m kahwa_publisher.slots done newsroom "${{ needs.gate.outputs.key }}"
            git add state/slots
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "slot done ${{ needs.gate.outputs.key }}" && git push -q origin HEAD:main && { ok=1; break; }
            sleep $((i*5)); done; [ $ok = 1 ]
