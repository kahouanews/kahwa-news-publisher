name: deps-automerge
# Dependabot PRs only. Job 1 runs the PR's code with NO secrets and a read-only token (supply-chain safe: npm ci from the
# lockfile with --ignore-scripts, pinned actions). Job 2 never checks out or runs PR code; it only merges when job 1 passed.
# No AI step reads PR text anywhere.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: { DO_NOT_TRACK: "1", HYPERFRAMES_TELEMETRY: "0", PYTHONUNBUFFERED: "1", KAHWA_BUILD: /tmp/kahwa-reel, HF_WORKERS: "3" }
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7.1.0
        with: { node-version: "22" }
      - name: Deps (pinned, no install scripts)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          pip install -q -r requirements-ci.txt
          npm ci --prefix kahwa_publisher/reels --ignore-scripts --no-audit --no-fund && npm rebuild esbuild --prefix kahwa_publisher/reels
          cd kahwa_publisher/reels && npx hyperframes telemetry disable || true; npx hyperframes browser ensure
          echo "KAHWA_CHROME=$(npx hyperframes browser path | tail -1)" >> "$GITHUB_ENV"
      - run: python -m pytest -q
      - name: Dry fixture render (reel, full toolchain + file QA)
        run: mkdir -p out && python -m kahwa_publisher.reels.make --out out --dry --story tests/fixtures/reel-map-tunisia.json
  merge:
    needs: verify
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge (no checkout, no PR code executed here)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --repo "${{ github.repository }}"
