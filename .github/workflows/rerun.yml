name: rerun-transient
# Self-healing, deterministic (research 2026-10-31 §2.1/§5-A5): a failed scheduled newsroom/bulletin/reel run is re-run ONCE,
# after a backoff, and ONLY when tools/ci_doctor.py classifies the failure as transient (headless-Chrome crash, timeout,
# network/source down, git push race, render crash). Layout/audio/content/code/quota/auth failures are never re-run: they
# would fail the same way or are fail-closed decisions. publish is excluded (it runs every 20 min anyway and must never
# risk a double post). No AI, no secrets: GITHUB_TOKEN with actions:write only.
on:
  workflow_run:
    workflows: [newsroom, bulletin, reel]
    types: [completed]
permissions:
  actions: write
  contents: read
concurrency:
  group: rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { sparse-checkout: tools, persist-credentials: false }
      - name: Classify (transient only)
        id: c
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set +e
          python3 tools/ci_doctor.py --rerun-check ${{ github.event.workflow_run.id }} | tee cause.json
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Backoff, then re-run the failed jobs once
        if: steps.c.outputs.rc == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sleep 240
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo "${{ github.repository }}"
