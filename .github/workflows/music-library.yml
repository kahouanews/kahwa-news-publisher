name: music-library (one-off, manual)
# Renders Kahwa News' own instrumental music library with ACE-Step 1.5 (MIT code + weights; model card:
# "You can strictly use the generated music for commercial purposes") via acestep.cpp on CPU.
# Never publishes anything: outputs are uploaded as workflow artifacts for offline QA.
on:
  workflow_dispatch:
    inputs:
      shards_json: { description: "matrix of shard indexes (JSON list)", default: "[0,1,2,3,4,5]" }
      of: { description: "total number of shards", default: "6" }
      dit: { description: "DiT GGUF file", default: "acestep-v15-xl-turbo-Q8_0.gguf" }
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards_json) }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/music }
      - name: Build acestep.cpp (pinned commit, CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev cmake >/dev/null
          git clone -q https://github.com/ServeurpersoCom/acestep.cpp.git ace
          cd ace && git checkout -q de858d8e1a94f0e1939cf9bdd8ff7d9631953077 && git submodule update --init --recursive -q
          mkdir build && cd build && cmake .. -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build . --config Release -j "$(nproc)" 2>&1 | tail -3
          ls -la ace-lm ace-synth ace-understand
      - name: Download GGUF weights (Serveurperso/ACE-Step-1.5-GGUF, MIT)
        run: |
          pip install -q -U "huggingface_hub[hf_xet]"
          hf download Serveurperso/ACE-Step-1.5-GGUF vae-BF16.gguf Qwen3-Embedding-0.6B-Q8_0.gguf \
            acestep-5Hz-lm-1.7B-Q8_0.gguf ${{ inputs.dit }} --local-dir ace/models
          ls -la ace/models
      - name: Generate
        run: python tools/music/gen.py --ace ace --shard ${{ matrix.shard }} --of ${{ inputs.of }} --dit ${{ inputs.dit }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-shard-${{ matrix.shard }}
          path: |
            out/**/*.wav
            out/**/*.json
            out/**/*.log
          retention-days: 7
