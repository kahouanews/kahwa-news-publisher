name: ci
# Tests on every push to main + a nightly smoke test of the full toolchain (dry fixture renders: no news fetch, no LLM, never
# queued, nothing published). No secrets in this workflow.
on:
  push:
    branches: [main]
    paths: ["kahwa_publisher/**", "tests/**", "tools/**", "requirements-ci.txt", ".github/workflows/**"]
  schedule:
    - cron: "17 2 * * *"      # 03:17 Algeria
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-ci.txt }
      - name: ffmpeg + pinned deps
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          for i in 1 2 3; do pip install -q -r requirements-ci.txt && break; sleep $((i*20)); done
      - run: python -m pytest -q
      - name: Workflow lockfile is current (actions pinned via .github/workflows/actions.lock)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh extension install github/gh-actions-lock && gh actions-lock --verify
  smoke:
    # nightly: the real render toolchain end to end on saved fixtures (bulletin body + reel), through the normal workflows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch dry fixture renders (never queued)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh workflow run reel.yml --repo "${{ github.repository }}" -f dry_run=true -f test_story=tests/fixtures/reel-map-tunisia.json
          gh workflow run bulletin.yml --repo "${{ github.repository }}" -f dry_run=true -f test_fixture=tests/fixtures/bulletin-2026-10-29.json
