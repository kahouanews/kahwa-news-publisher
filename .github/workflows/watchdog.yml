name: watchdog
on:
  schedule:
    - cron: "33 */2 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Backup clock only (Cloudflare Worker): ISO slot time, e.g. 2026-11-01T06:30Z. Empty = snap the run start to the last scheduled slot"
        type: string
        default: ""
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: watchdog            # one run per workflow at a time; duplicate clocks queue, then skip at the gate
  cancel-in-progress: false
jobs:
  gate:
    # slot dedupe for 3 clocks (cron-job.org, Cloudflare Worker backup, GitHub schedule): kahwa_publisher/slots.py
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      key: ${{ steps.g.outputs.key }}
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main, persist-credentials: false }   # latest main at job start: sees markers pushed by an earlier clock
      - id: g
        env:
          SLOT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          TEST: false
          MODE_IN: auto
        run: |
          python3 -m kahwa_publisher.slots gate watchdog --slot "$SLOT_IN" --test "$TEST" --mode "$MODE_IN" | tee gate.json
          echo "### slot gate: $(cat gate.json)" >> "$GITHUB_STEP_SUMMARY"
  watch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main }   # latest state/ + queue/ (a queued duplicate run must not act on a stale checkout)
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12" }
      - run: python -m kahwa_publisher.dispatcher watchdog || true
        env:
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
      - name: Publisher connection health (Zernio /accounts/health -> circuit + one issue per problem)
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_FB_ACCOUNT_ID: ${{ vars.ZERNIO_FB_ACCOUNT_ID }}
        run: |
          python -m kahwa_publisher.health
          python - <<'PY'
          import json, subprocess
          for i in json.load(open("health-issues.json")):
              n = subprocess.run(["gh", "issue", "list", "--state", "open", "--search", i["title"] + " in:title", "--json", "title"],
                                 capture_output=True, text=True).stdout
              if not any(x["title"] == i["title"] for x in json.loads(n or "[]")):
                  subprocess.run(["gh", "issue", "create", "--title", i["title"], "--body", i["body"]])
          PY
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          git add state/provider_health.json
          git diff --cached --quiet || { git commit -qm "provider health $(date -u +%FT%TZ)"; for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && break; sleep 7; done; }
      - name: CI doctor (classify failed runs -> one issue per workflow+cause; report disabled workflows; no AI, no secrets)
        env: { GH_TOKEN: "${{ github.token }}" }
        continue-on-error: true
        run: python tools/ci_doctor.py --hours 26
      - name: API key expiry reminder (one issue per key, from 14 days before expiry)
        env:
          GH_TOKEN: "${{ github.token }}"
          # NAME=YYYY-MM-DD list; SambaNova free key created 2026-10-29 expires after ~3 months
          KEY_EXPIRIES: ${{ vars.KEY_EXPIRIES || 'SAMBANOVA_API_KEY=2027-01-29 BUFFER_API_KEY=2026-11-27' }}
        run: |
          for kv in $KEY_EXPIRIES; do
            name=${kv%%=*}; exp=${kv##*=}
            left=$(( ( $(date -ud "$exp" +%s) - $(date -u +%s) ) / 86400 ))
            [ "$left" -gt 14 ] && continue
            title="Kahwa: $name expires $exp"
            if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qx 0; then
              printf '%s\n' "The $name API key expires on $exp ($left days left)." \
                "Create a new free key, update the GitHub Actions secret $name, then update the repo variable KEY_EXPIRIES." \
                "Until then: LLM keys -> the router skips the provider; publisher keys (BUFFER_/ZERNIO_/MAKE_) -> the dispatcher demotes it 3 days before and skips it after expiry (automatic failover)." > key.txt
              gh issue create --title "$title" --body-file key.txt || true
            fi
          done
      - name: Alert
        if: hashFiles('state/ALERT.txt') != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T="Kahwa watchdog alert"; N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file state/ALERT.txt || true; else gh issue create --title "$T" --body-file state/ALERT.txt || true; fi
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          git rm -q state/ALERT.txt && git commit -qm "watchdog alert" && git push -q || true
      - name: Mark slot done (first successful run of the slot; the other clocks then skip at the gate)
        if: success() && needs.gate.outputs.key != ''
        run: |
          # earlier steps already pushed their own commits (or the job failed): re-apply the marker on the newest main each
          # try, so a concurrent bot commit can never leave a rebase conflict (run 41190343334)
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          ok=0; for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -m kahwa_publisher.slots done watchdog "${{ needs.gate.outputs.key }}"
            git add state/slots
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "slot done ${{ needs.gate.outputs.key }}" && git push -q origin HEAD:main && { ok=1; break; }
            sleep $((i*5)); done; [ $ok = 1 ]
