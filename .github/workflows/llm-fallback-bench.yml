name: llm-fallback-bench (one-off, manual)
# Measures whether an open Arabic model can be the newsroom's fallback writer when the Gemini free tier fails:
# llama.cpp (prebuilt release, CPU) + Jais 3 GGUF (Apache-2.0 per model card). Writes the real newsroom prompt for a
# current verified story and reports latency, tokens/s, JSON validity and the text. Publishes nothing, queues nothing.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "space-separated repo:file"
        default: "IFM/Jais-3-3.7B-GGUF:Jais-3-3.7B-Q4_K_M.gguf IFM/Jais-3-0.9B-GGUF:Jais-3-0.9B-Q8_0.gguf"
      llama_tag: { description: "llama.cpp release tag", default: "b11972" }
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: llama.cpp ${{ inputs.llama_tag }} (prebuilt CPU x64)
        run: |
          curl -sL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${{ inputs.llama_tag }}/llama-${{ inputs.llama_tag }}-bin-ubuntu-x64.tar.gz"
          mkdir llama && tar -xzf llama.tgz -C llama --strip-components=1 || tar -xzf llama.tgz -C llama
          find llama -name 'llama-server' -type f | head -1 > server_path.txt
          cat server_path.txt; "$(cat server_path.txt)" --version || true
          nproc; free -g
      - name: Weights
        run: |
          pip install -q -U "huggingface_hub[hf_xet]" feedparser
          for m in ${{ inputs.models }}; do hf download "${m%%:*}" "${m##*:}" --local-dir models; done
          ls -la models
      - name: Bench
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          LLM_QUOTA_FILE: bench/llm_quota-bench.json
        run: python tools/llm/bench.py --server "$(cat server_path.txt)" --models "${{ inputs.models }}" --out bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: llm-bench-${{ github.run_id }}
          path: bench/
          retention-days: 7
