name: publish
on:
  schedule:
    - cron: "7,27,47 * * * *"   # odd minutes: GitHub drops/late-runs top-of-hour jobs
  workflow_dispatch:
    inputs:
      slot:
        description: "Backup clock only (Cloudflare Worker): ISO slot time, e.g. 2026-11-01T06:30Z. Empty = snap the run start to the last scheduled slot"
        type: string
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: publish            # one run per workflow at a time; duplicate clocks queue, then skip at the gate
  cancel-in-progress: false
jobs:
  gate:
    # slot dedupe for 3 clocks (cron-job.org, Cloudflare Worker backup, GitHub schedule): kahwa_publisher/slots.py
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      key: ${{ steps.g.outputs.key }}
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main, persist-credentials: false }   # latest main at job start: sees markers pushed by an earlier clock
      - id: g
        env:
          SLOT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          TEST: false
          MODE_IN: auto
        run: |
          python3 -m kahwa_publisher.slots gate publish --slot "$SLOT_IN" --test "$TEST" --mode "$MODE_IN" | tee gate.json
          echo "### slot gate: $(cat gate.json)" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with: { ref: main }   # latest state/ + queue/ (a queued duplicate run must not act on a stale checkout)
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q cryptography==50.0.2   # pinned (requirements-ci.txt)
      - name: Publish next due post (with failover)
        id: run
        continue-on-error: true
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_FB_ACCOUNT_ID: ${{ vars.ZERNIO_FB_ACCOUNT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CLIENT_ID: ${{ vars.BUFFER_CLIENT_ID }}
          BUFFER_TOKEN_KEY: ${{ secrets.BUFFER_TOKEN_KEY }}
          BUFFER_REFRESH_TOKEN: ${{ secrets.BUFFER_REFRESH_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          DAILY_CAP: ${{ vars.DAILY_CAP }}
          # expired publisher keys are skipped, expiring ones demoted (dispatcher.order_by_key_expiry)
          KEY_EXPIRIES: ${{ vars.KEY_EXPIRIES || 'SAMBANOVA_API_KEY=2027-01-29 BUFFER_API_KEY=2026-11-27' }}
        run: python -m kahwa_publisher.dispatcher
      - name: Save state (also keeps the schedule alive)
        if: always()
        run: |
          git config user.name "kahwa-bot"
          git config user.email "kahwa-bot@users.noreply.github.com"
          git add -A queue state
          git diff --cached --quiet || git commit -m "publisher state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Alert (GitHub issue = email notification)
        if: always() && hashFiles('state/ALERT.txt') != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "Kahwa publisher alert $(date -u +%F' '%H:%M)" --body-file state/ALERT.txt || true
          git rm -q state/ALERT.txt && git commit -qm "alert raised" && git push -q || true
      - name: Fail job if publish failed (GitHub emails the owner)
        if: steps.run.outcome == 'failure'
        run: exit 1
      - name: Mark slot done (first successful run of the slot; the other clocks then skip at the gate)
        if: success() && needs.gate.outputs.key != ''
        run: |
          # earlier steps already pushed their own commits (or the job failed): re-apply the marker on the newest main each
          # try, so a concurrent bot commit can never leave a rebase conflict (run 41190343334)
          git config user.name kahwa-bot; git config user.email kahwa-bot@users.noreply.github.com
          ok=0; for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -m kahwa_publisher.slots done publish "${{ needs.gate.outputs.key }}"
            git add state/slots
            git diff --cached --quiet && { ok=1; break; }
            git commit -qm "slot done ${{ needs.gate.outputs.key }}" && git push -q origin HEAD:main && { ok=1; break; }
            sleep $((i*5)); done; [ $ok = 1 ]
